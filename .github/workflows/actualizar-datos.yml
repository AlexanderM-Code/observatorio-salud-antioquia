name: Actualizar datos

# Descarga los datos más recientes de SIVIGILA, los limpia y publica los
# archivos que usa la página. Corre el día 1 de cada mes, a mano, y cuando
# cambia el código del pipeline.
on:
  schedule:
    - cron: "17 11 1 * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "etl/**"
      - ".github/workflows/actualizar-datos.yml"

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Ejecutar el pipeline (sin MySQL)
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m etl.pipeline --sin-mysql

      - name: Publicar los cambios si los datos cambiaron
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/processed
          if git diff --cached --quiet -- data/processed docs/data/eventos_por_anio.json docs/data/semanal.json docs/data/top_municipios.json; then
            echo "Los datos no cambiaron."
          else
            git commit -m "Actualiza datos de SIVIGILA ($(date -u +%Y-%m-%d))"
            git push
          fi
